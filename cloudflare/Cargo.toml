[package]
name = "cloudflare"
version = "0.13.0"
authors = ["Noah Kennedy <nkennedy@cloudflare.com>", "Jeff Hiner <jhiner@cloudflare.com>", "Kenneth Eversole <keversole@cloudflare.com>"]
repository = "https://github.com/cloudflare/cloudflare-rs"
edition = "2018"
description = "Rust library for the Cloudflare v4 API"
keywords = ["cloudflare", "api", "client"]
categories = ["api-bindings", "web-programming::http-client"]
license = "BSD-3-Clause"

[features]
default = ["default-tls"]
blocking = ["reqwest/blocking"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
spec = []
endpoint-spec = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
    "wasmbind",
] }
http = "1.5.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.12", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", features = ["base64"] }
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["serde"] }
