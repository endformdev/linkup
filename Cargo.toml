[workspace]
resolver = "2"

members = [
    "linkup-cli",
    "linkup",
    "linkup-clients",
    "worker",
    "local-server",
    "server-tests",
    "cloudflare",
]

[workspace.package]
version = "4.1.1"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
url = { version = "2.5.8", features = ["serde"] }

linkup = { path = "linkup" }
linkup-clients = { path = "linkup-clients" }
linkup-local-server = { path = "local-server" }
cloudflare = { path = "cloudflare", default-features = false }
