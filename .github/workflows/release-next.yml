name: Create Beta Release (next)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from"
        required: false
        default: "next"
  # push:
  #   branches:
  #     - next

concurrency:
  group: release-next
  cancel-in-progress: true

jobs:
  resolve-branch:
    name: Resolve Branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Resolve
        id: resolve
        run: echo "branch=${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}" >> "$GITHUB_OUTPUT"

  generate-version:
    name: Generate Release Version
    runs-on: ubuntu-latest
    needs: [resolve-branch]
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}

      - name: Generate Next Release Version
        id: generate_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const shortSha = execSync('git rev-parse --short HEAD').toString().trim();
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const timestamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}`;
            const nextVersion = `0.0.0-next-${timestamp}-${shortSha}`;

            core.info(`Set release version to ${nextVersion}`);

            core.setOutput('version', nextVersion);

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [resolve-branch, generate-version]
    strategy:
      matrix:
        include:
          # - build: linux
          #   os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          # - build: aarch64
          #   os: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   linker: gcc-aarch64-linux-gnu
          # - build: macos
          #   os: macos-14
          #   target: x86_64-apple-darwin
          - build: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}

      - name: Update Cargo.toml Version
        run: |
          sed -i.bak 's@^version = .*@version = "${{ needs.generate-version.outputs.version }}"@' Cargo.toml
          rm Cargo.toml.bak

      - name: Install Rust
        run: |
          rustup install stable
          rustup target add ${{ matrix.target }}
          rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --manifest-path linkup-cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package and Calculate Checksums
        id: package
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
          RELEASE_VERSION: ${{ needs.generate-version.outputs.version }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const releaseVersion = process.env.RELEASE_VERSION;
            const target = process.env.TARGET;
            const runnerOs = process.env.RUNNER_OS;
            if (!releaseVersion) {
              throw new Error("RELEASE_VERSION is not set");
            }

            const binaryPath = `target/${target}/release/linkup`;

            const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'linkup-'));

            fs.copyFileSync(binaryPath, path.join(tmpDir, 'linkup'));

            const assetName = `linkup-${target}.tar.gz`;
            execSync(`tar czf ${assetName} -C ${tmpDir} linkup`);

            let checksum;
            if (runnerOs === 'Linux') {
              checksum = execSync(`sha256sum ${assetName}`).toString().split(' ')[0];
            } else {
              checksum = execSync(`shasum -a 256 ${assetName}`).toString().split(' ')[0];
            }

            const checksumFile = `${assetName}.sha256`;
            fs.writeFileSync(checksumFile, `${checksum} ${assetName}`);

            core.setOutput('asset_name', assetName);
            core.setOutput('checksum_file', checksumFile);

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          target_commitish: ${{ needs.resolve-branch.outputs.branch }}
          prerelease: true
          files: |
            ${{ steps.package.outputs.asset_name }}
            ${{ steps.package.outputs.checksum_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
